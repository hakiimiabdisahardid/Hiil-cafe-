<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order — HIIL CAFE</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/premium-effects.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<nav class="site-nav scrolled">
  <div class="container">
    <a href="index.html" class="brand"><span class="brand-mark" aria-label="HIIL CAFE logo">H</span></a>
    <div class="nav-actions" style="margin-left:auto">
      <button class="btn btn-ghost btn-sm theme-toggle-btn" data-theme-toggle><i class="fa-solid fa-sun"></i> Light</button>
      <span class="eyebrow" id="tableLabel" style="margin:0"><i class="fa-solid fa-chair"></i>&nbsp; Table —</span>
    </div>
  </div>
</nav>

<header style="padding:140px 0 30px">
  <div class="container">
    <div class="eyebrow">Scan &amp; Order</div>
    <h1 class="display-lg" style="margin-top:12px">What are you in the mood for?</h1>
    <p class="lead" style="margin-top:10px">Browse the menu, add items, and send your order straight to the kitchen — no waiting for a waiter.</p>
    <div class="field" style="max-width:420px;margin-top:26px"><input type="text" id="searchInput" placeholder="Search the menu..."></div>
    <div class="pill-tabs" id="catTabs" style="margin-top:18px"></div>
  </div>
</header>

<section style="padding-top:0">
  <div class="container">
    <div class="grid grid-3" id="menuGrid"></div>
  </div>
</section>

<!-- order cart -->
<div class="cart-overlay" id="cartOverlay2"></div>
<div class="cart-drawer" id="cartDrawer2">
  <div class="cart-head"><h3>Table <span id="tableNumInHead">—</span> Order</h3><button id="closeCart"><i class="fa-solid fa-xmark"></i></button></div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-foot">
    <div class="row"><span>Subtotal</span><span id="cartSubtotal">$0.00</span></div>
    <div class="row"><span>Tax</span><span id="cartTax">$0.00</span></div>
    <div class="row total"><span>Total</span><span id="cartTotal">$0.00</span></div>
    <div style="margin-top:14px;display:grid;gap:10px">
      <label class="field" style="margin:0">
        <span class="eyebrow" style="display:block;margin-bottom:6px">Recitation taken from</span>
        <input type="text" id="takenFromInput" placeholder="e.g. Table 7, Counter, Delivery">
      </label>
      <label class="field" style="margin:0">
        <span class="eyebrow" style="display:block;margin-bottom:6px">Bill issued to</span>
        <input type="text" id="billToInput" placeholder="Person being charged">
      </label>
    </div>
    <button class="btn btn-gold btn-block" id="placeOrderBtn" style="margin-top:16px">Send Order to Kitchen <i class="fa-solid fa-kitchen-set"></i></button>
  </div>
</div>
<button class="fab-cart" id="fabCart"><i class="fa-solid fa-bag-shopping"></i><span class="count" id="cartCount">0</span></button>

<!-- order confirmation modal -->
<div id="confirmOverlay" class="cart-overlay"></div>
<div id="confirmModal" class="glass-card" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4000;width:92%;max-width:420px;padding:40px;text-align:center">
  <div style="width:60px;height:60px;border-radius:50%;background:rgba(95,168,118,.15);color:var(--success);display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 20px"><i class="fa-solid fa-check"></i></div>
  <h3>Order sent!</h3>
  <p class="desc" style="margin-top:10px">Your order <strong id="confOrderNo"></strong> is on its way to the kitchen from <span id="confTakenFrom"></span>. The bill will be issued to <strong id="confBillTo"></strong>.</p>
  <button class="btn btn-gold btn-block" id="closeConfirm" style="margin-top:22px">Done</button>
</div>

<div id="toast-wrap"></div>
<script src="assets/js/data.js"></script>
<script>
initThemeToggle();
const params = new URLSearchParams(location.search);
const tableNum = params.get('table') || '—';
document.getElementById('tableLabel').innerHTML = `<i class="fa-solid fa-chair"></i>&nbsp; Table ${tableNum}`;
document.getElementById('tableNumInHead').textContent = tableNum;

const db = HIIL.load();
let activeCat='All', query='';
const cats = ['All', ...new Set(db.menu.map(m=>m.cat))];
document.getElementById('catTabs').innerHTML = cats.map(c=>`<button class="pill ${c==='All'?'active':''}" data-cat="${c}">${c}</button>`).join('');
document.getElementById('takenFromInput').value = `Table ${tableNum}`;

function render(){
  let items = db.menu.filter(m=>{
    const mc = activeCat==='All'||m.cat===activeCat;
    const mq = m.name.toLowerCase().includes(query.toLowerCase());
    return mc && mq;
  });
  document.getElementById('menuGrid').innerHTML = items.map(m=>`
    <div class="food-card">
      <div class="img-wrap">
        <img src="${m.img}" alt="${m.name}" loading="lazy">
        <div class="badges">
          ${m.popular?'<span class="badge badge-popular">Popular</span>':''}
          ${!m.available?'<span class="badge badge-out">Out of Stock</span>':''}
        </div>
      </div>
      <div class="body">
        <div class="row-top"><h4>${m.name}</h4><span class="price">${fmtMoney(m.price)}</span></div>
        <p class="desc">${m.desc}</p>
        <button class="btn ${m.available?'btn-gold':'btn-ghost'} add-btn" data-id="${m.id}" ${m.available?'':'disabled'}>
          ${m.available?'<i class="fa-solid fa-plus"></i> Add':'Unavailable'}
        </button>
      </div>
    </div>
  `).join('');
}
render();
document.getElementById('catTabs').addEventListener('click', e=>{
  const b=e.target.closest('.pill'); if(!b) return;
  activeCat=b.dataset.cat;
  document.querySelectorAll('#catTabs .pill').forEach(p=>p.classList.remove('active')); b.classList.add('active');
  render();
});
document.getElementById('searchInput').addEventListener('input', e=>{ query=e.target.value; render(); });
document.getElementById('menuGrid').addEventListener('click', e=>{
  const btn = e.target.closest('.add-btn'); if(!btn||btn.disabled) return;
  const item = db.menu.find(m=>m.id===btn.dataset.id);
  HIIL.addToCart(item);
  toast(item.name+' added');
});

function renderCart(){
  const cart = HIIL.getCart();
  document.getElementById('cartCount').textContent = cart.reduce((s,c)=>s+c.qty,0);
  const wrap = document.getElementById('cartItems');
  wrap.innerHTML = cart.length ? cart.map(c=>`
    <div class="cart-item">
      <img src="${c.img}" alt="">
      <div style="flex:1">
        <div style="display:flex;justify-content:space-between"><strong>${c.name}</strong><span class="price">${fmtMoney(c.price*c.qty)}</span></div>
        <div class="qty-ctrl"><button data-id="${c.id}" data-d="-1">−</button><span>${c.qty}</span><button data-id="${c.id}" data-d="1">+</button></div>
      </div>
    </div>`).join('') : '<div class="empty-state"><div class="icon"><i class="fa-solid fa-bag-shopping"></i></div><p>No items yet — add something delicious.</p></div>';
  const sub = HIIL.cartTotal(), tax = sub*(db.settings.tax/100);
  document.getElementById('cartSubtotal').textContent = fmtMoney(sub);
  document.getElementById('cartTax').textContent = fmtMoney(tax);
  document.getElementById('cartTotal').textContent = fmtMoney(sub+tax);
}
renderCart();
window.addEventListener('hiil-cart-updated', renderCart);
document.getElementById('cartItems').addEventListener('click', e=>{
  const b=e.target.closest('button[data-d]'); if(!b) return;
  const cart=HIIL.getCart(); const it=cart.find(c=>c.id===b.dataset.id);
  HIIL.updateCartQty(b.dataset.id, it.qty+parseInt(b.dataset.d));
});

const drawer2=document.getElementById('cartDrawer2'), overlay2=document.getElementById('cartOverlay2');
document.getElementById('fabCart').addEventListener('click', ()=>{ drawer2.classList.add('open'); overlay2.classList.add('open'); });
document.getElementById('closeCart').addEventListener('click', ()=>{ drawer2.classList.remove('open'); overlay2.classList.remove('open'); });
overlay2.addEventListener('click', ()=>{ drawer2.classList.remove('open'); overlay2.classList.remove('open'); });

document.getElementById('placeOrderBtn').addEventListener('click', ()=>{
  const cart = HIIL.getCart();
  if(!cart.length){ toast('Your cart is empty', 'err'); return; }
  const liveDb = HIIL.load();
  const takenFrom = document.getElementById('takenFromInput').value.trim() || `Table ${tableNum}`;
  const billTo = document.getElementById('billToInput').value.trim() || 'Walk-in guest';
  const orderNo = 'HC-' + (liveDb.nextOrderNo++);
  const order = {
    id: 'o_'+Date.now(), no: orderNo, table: tableNum,
    takenFrom,
    chargedTo: billTo,
    items: cart.map(c=>({ id:c.id, name:c.name, qty:c.qty, price:c.price })),
    total: cart.reduce((s,c)=>s+c.price*c.qty,0),
    status: 'New', createdAt: Date.now()
  };
  liveDb.orders.unshift(order);
  HIIL.save(liveDb);
  HIIL.notifyManager('New order received', `Table ${tableNum} placed order ${orderNo} for ${cart.length} item(s) with total ${fmtMoney(order.total)}. Taken from ${takenFrom}; billed to ${billTo}.`);
  HIIL.clearCart();
  document.getElementById('confOrderNo').textContent = orderNo;
  document.getElementById('confTakenFrom').textContent = takenFrom;
  document.getElementById('confBillTo').textContent = billTo;
  document.getElementById('confirmOverlay').classList.add('open');
  document.getElementById('confirmModal').style.display = 'block';
  drawer2.classList.remove('open'); overlay2.classList.remove('open');
});
document.getElementById('closeConfirm').addEventListener('click', ()=>{
  document.getElementById('confirmOverlay').classList.remove('open');
  document.getElementById('confirmModal').style.display = 'none';
});
</script>
</body>
</html>
